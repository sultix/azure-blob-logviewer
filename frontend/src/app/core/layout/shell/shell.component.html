<div class="flex h-full flex-col bg-surface">
  <p-toast position="bottom-right" />

  <header
    class="drag-region flex h-12 shrink-0 items-center justify-between bg-surface-container-high pl-5 pr-0"
    (dblclick)="onToggleMaximize()"
  >
    <div class="flex min-w-0 flex-1 items-center gap-0">
      <div class="flex shrink-0 items-center gap-2.5 2xl:w-[var(--layout-sidebar-width)]">
        <span class="flex h-6 w-6 items-center justify-center text-on-primary">
          <img
            src="/assets/branding/app-icon.png"
            alt="{{ 'shell.appIconAlt' | translate }}"
            class="rounded"
          />
        </span>
        <span class="font-display text-sm font-semibold tracking-wide text-on-surface">
          {{ 'shell.appName' | translate }}
        </span>
        @if (appVersion(); as version) {
          <span
            class="text-[11px] font-medium rounded-full bg-surface-container-highest px-2 py-0.5 tracking-widest"
          >
            v{{ version }}
          </span>
        }
      </div>

      @if (showBackButton()) {
        <nav class="no-drag flex items-center gap-1 ms-3 2xl:ms-0">
          <button
            type="button"
            (click)="onBack()"
            class="flex items-center gap-2 border-b-2 border-transparent p-2 text-xs font-medium uppercase tracking-wider text-on-surface-variant transition-colors rounded-md hover:text-on-surface hover:bg-surface-container-highest"
          >
            <i class="pi pi-arrow-left text-[13px]"></i>
            {{ 'shell.navigation.back' | translate }}
          </button>
        </nav>
      }

      @if (authInProgress()) {
        <span
          role="status"
          aria-live="polite"
          [attr.aria-label]="'shell.auth.authenticatingAriaLabel' | translate"
          class="ms-3 flex shrink-0 items-center gap-1.5 rounded-full bg-surface-container-highest px-2 py-0.5 text-[11px] font-medium tracking-wide text-on-surface-variant"
        >
          <svg
            class="h-3 w-3 animate-spin"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            ></path>
          </svg>
          {{ 'shell.auth.authenticating' | translate }}
        </span>
      }
    </div>

    <div class="no-drag flex h-full items-stretch">
      <nav class="no-drag flex items-center gap-1">
        <a
          routerLink="/settings"
          routerLinkActive="text-on-surface border-primary"
          class="flex items-center gap-2 border-b-2 border-transparent p-2 text-xs font-medium uppercase tracking-wider text-on-surface-variant transition-colors rounded-md hover:text-on-surface hover:bg-surface-container-highest"
        >
          <i class="pi pi-cog text-[13px]"></i>
          {{ 'shell.navigation.settings' | translate }}
        </a>
      </nav>
      <button
        type="button"
        (click)="onMinimize()"
        [attr.aria-label]="'shell.window.minimize' | translate"
        class="flex h-full w-12 items-center justify-center text-on-surface-variant transition-colors hover:bg-surface-container-highest hover:text-on-surface"
      >
        <i class="pi pi-minus text-[11px]"></i>
      </button>
      <button
        type="button"
        (click)="onToggleMaximize()"
        [attr.aria-label]="maximizeButtonLabel() | translate"
        class="flex h-full w-12 items-center justify-center text-on-surface-variant transition-colors hover:bg-surface-container-highest hover:text-on-surface"
      >
        @if (isMaximized()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            class="size-8"
          >
            <path
              stroke-linecap="square"
              stroke-linejoin="miter"
              d="M9.75 7.5h6.75v6.75"
            />
            <path
              stroke-linecap="square"
              stroke-linejoin="miter"
              d="M7.5 9.75h6.75v6.75H7.5z"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
            class="size-8"
          >
            <rect x="7.5" y="7.5" width="9" height="9" stroke-linejoin="miter" />
          </svg>
        }
      </button>
      <button
        type="button"
        (click)="onClose()"
        [attr.aria-label]="'shell.window.close' | translate"
        class="flex h-full w-12 items-center justify-center text-on-surface-variant transition-colors hover:bg-error-container hover:text-on-surface"
      >
        <i class="pi pi-times text-[11px]"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-hidden bg-surface">
    <ng-content />
  </main>
</div>
