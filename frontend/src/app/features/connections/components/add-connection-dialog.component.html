<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-5">
  <p class="text-xs text-on-surface-variant">
    {{ descriptionKey | translate }}
  </p>

  <label class="flex flex-col gap-1.5">
    <span
      class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant"
    >
      {{ "connections.dialog.connectionName" | translate }}
    </span>
    <input
      pInputText
      type="text"
      formControlName="name"
      [placeholder]="'connections.dialog.connectionNamePlaceholder' | translate"
      class="w-full rounded-lg bg-surface-container-lowest px-4 py-2.5 font-mono text-sm text-on-surface placeholder:text-outline"
    />
  </label>

  <label class="flex flex-col gap-1.5">
    <span
      class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant"
    >
      {{ "connections.dialog.category" | translate }}
    </span>
    <input
      pInputText
      type="text"
      formControlName="category"
      [placeholder]="'connections.dialog.categoryPlaceholder' | translate"
      class="w-full rounded-lg bg-surface-container-lowest px-4 py-2.5 font-mono text-sm text-on-surface placeholder:text-outline"
    />
  </label>

  <app-azure-resource-picker
    [subscriptionControl]="subscriptionControl"
    [storageAccountControl]="storageAccountControl"
    [containerControl]="containerControl"
    [subscriptions]="subscriptionsValue"
    [subscriptionsLoading]="subscriptionsLoadingValue"
    [subscriptionsError]="subscriptionsErrorValue"
    [storageAccounts]="storageAccountsValue"
    [storageAccountsLoading]="storageAccountsLoadingValue"
    [storageAccountsError]="storageAccountsErrorValue"
    [containers]="containersValue"
    [containersLoading]="containersLoadingValue"
    [containersError]="containersErrorValue"
  />

  <div class="flex justify-end gap-2 pt-2">
    <button
      type="button"
      (click)="cancel()"
      class="rounded-lg px-4 py-2 text-sm font-semibold text-on-surface-variant transition-colors hover:text-on-surface"
    >
      {{ "common.actions.cancel" | translate }}
    </button>
    <button
      type="submit"
      [disabled]="!canSaveValue"
      class="rounded-lg bg-primary-gradient px-4 py-2 text-sm font-semibold text-on-primary disabled:opacity-40"
    >
      {{ submitLabelKey | translate }}
    </button>
  </div>
</form>
